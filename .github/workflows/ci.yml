name: Verify platform
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nettopo
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: nettopo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nettopo -d nettopo_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://nettopo:test-only-password@127.0.0.1:5432/nettopo_test
      DIRECT_URL: postgresql://nettopo:test-only-password@127.0.0.1:5432/nettopo_test
      NETTOPO_TEST_DATABASE_URL: postgresql://nettopo:test-only-password@127.0.0.1:5432/nettopo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:deploy
      - run: npm run check
      - run: npm audit --workspaces --include-workspace-root --audit-level=moderate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-evidence
          path: test-results/
